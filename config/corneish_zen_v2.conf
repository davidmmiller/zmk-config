# Corne-ish Zen v2 Configuration

# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# Uncomment to set time before going to sleep (in milliseconds)
# Default is 900000 (15 minutes)
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y

# Uncomment to enable encoder (Corne-ish Zen v2 has optional encoder support)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Keyboard name (shows in Bluetooth)
CONFIG_ZMK_KEYBOARD_NAME="Corne-ish Zen"

# Debounce configuration (default is usually fine)
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# RGB Underglow - Corne-ish Zen v2 has RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
# Set initial brightness (0-100)
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
# Turn off RGB when keyboard goes to idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Bluetooth transmit power (WEST_NORDIC only, but good for better range)
# Options: -40, -20, -16, -12, -8, -4, 0, 2, 3, 4, 5, 6, 7, 8 (dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Increase BLE transmit power for better range
CONFIG_BT_MAX_CONN=5

# Tapping term (similar to QMK's TAPPING_TERM)
# Default is 200ms - increase if you want more time before hold activates
# This affects all mod-tap and layer-tap behaviors globally
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_TAPPING_TERM_MS=200

# Quick tap term (similar to QMK's QUICK_TAP_TERM)
# Set to 0 to disable quick tap
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_QUICK_TAP_MS=0
