# Corne-ish Zen v2 Configuration
# Hardware: Wireless split keyboard with e-paper displays on each half
# No RGB LEDs (neither underglow nor per-key lighting)

# Keyboard name (shows in Bluetooth)
CONFIG_ZMK_KEYBOARD_NAME="Corne-ish Zen"

# Deep sleep configuration
# Uncomment to enable deep sleep after 15 minutes of inactivity
# E-paper displays retain their image when sleeping, saving power
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# USB Logging (disable for normal use to save battery)
# CONFIG_ZMK_USB_LOGGING=y

# Bluetooth settings
# Increased TX power for better wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_CONN=5

# Debounce settings (default is usually fine)
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
